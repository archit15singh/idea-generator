# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Idea Factory E2E Live Run"
  slug: "idea-factory-e2e-live"
  kind: existing_plan
  tranche: "continuous execution: run the idea-factory DAG for one live cohort from market scout through extraction + idea generation, then as far as scorer/validator/builder/clusterer preconditions allow; finish with a receipt-mapped audit."
  status: active
  oracle:
    signal: "A live cohort reaches stage_marker='analysed' with real SID rows and 20+ evidence-cited wedges per startup, produced by idea-factory agents from live web fetches, with receipts and gate outputs on every task."
    cadence: "after each Worker package and at final audit"
    final_proof: "scout receipt with market_segments + candidate_startups; ingestor receipt with real SID rows (startups.*, startup_problem/product/gtm/technical) and stage_marker='ingested'; analyst receipt with recursive_path + 20+ wedges passing evidence_gate; gate outputs; all task receipts present"
  intake:
    original_request: "Run the GoalBuddy /goal execution loop: execute the idea-factory skill and run the e2e workflow using the idea factory agents for a live web extraction + idea generation run."
    interpreted_outcome: "A live web-driven cohort flows through the idea-factory DAG (scout -> ingestor -> analyst -> scorer -> validator -> builder -> clusterer) using the idea-factory subagents, with deterministic gates verified in code and receipts on every task."
    input_shape: existing_plan
    audience: "the user (idea-factory operator / founder)"
    authority: requested
    proof_type: artifact
    completion_proof: "live cohort analysed with real SID rows + 20+ evidence-backed wedges; every task carries a receipt; gates (evidence_gate, top_wedge, graduation_gate, builder_accepts, promotion_gate) run in code; later stages blocked or approved with receipts"
    likely_misfire: "replaying the existing synthetic DB (placeholder wedges + fake outreach) instead of a live web extraction; agents fabricating evidence to pass gates; stopping after planning/Judge selection"
    blind_spots_considered:
      - "founder-profile.md is EMPTY -> scorer blocks at stage 04 (human-input gate)"
      - "validator sends real cold email (30/persona) and builder launches real MVPs -> real-world side effects requiring explicit approval + gmail pairing"
      - "existing DB holds 5 synthetic startups with placeholder wedges and fake outreach; re-ingest/re-analyse with live web data (idempotent upserts) to get real data"
      - "web scraping may time out; accept 404s per ingestor best-effort rule"
      - "cohort size must be bounded so the ingestor does not blow context on 30+ candidates"
    existing_plan_facts:
      - "DAG entry non-negotiable: start from pm.default_scout_input(), dispatch market scout, fan out on candidates"
      - "dispatch with typed inputs from idea_factory.pm; validate receipts with idea_factory.receipts.parse; route with idea_factory.decisions"
      - "honour rules: validation before build; no-evidence wedges die; scorer never overwrites human-locked personal_fit; clusterer uses fixed edge vocabulary; PM owns board truth"
      - "do not edit schema.py/db.py/decisions.py/receipts.py/agents/*.md/design notes during the run"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: starting
    url: "http://goalbuddy.localhost:41737/idea-factory-e2e-live/"
    command: "node /Users/architsingh/.config/opencode/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/idea-factory-e2e-live"

