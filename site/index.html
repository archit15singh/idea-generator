<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idea Board — Founder research library</title>
  <meta name="description" content="Browse and research startup intelligence, wedges, and patterns from the idea factory board." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to results</a>

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">Idea factory · board truth</p>
        <h1>Research library</h1>
      </div>
    </div>
    <div class="meta-bar" id="metaBar" aria-live="polite">Loading board…</div>
  </header>

  <div class="shell">
    <aside class="rail" aria-label="Filters">
      <label class="search-wrap">
        <span class="label">Search</span>
        <input id="q" type="search" placeholder="Company, idea, market, problem…" autocomplete="off" />
      </label>

      <div class="field">
        <span class="label">View</span>
        <div class="seg" role="tablist" aria-label="Board view">
          <button type="button" class="seg-btn active" data-view="ideas" role="tab" aria-selected="true">Ideas</button>
          <button type="button" class="seg-btn" data-view="patterns" role="tab" aria-selected="false">Patterns</button>
          <button type="button" class="seg-btn" data-view="markets" role="tab" aria-selected="false">Markets</button>
          <button type="button" class="seg-btn" data-view="infra" role="tab" aria-selected="false">Infra</button>
        </div>
      </div>

      <div class="field" id="ideaFilters">
        <span class="label">Market</span>
        <select id="market"></select>

        <span class="label">Wedge type</span>
        <select id="wedgeType"></select>

        <span class="label">Min founder fit</span>
        <div class="range-row">
          <input id="minFit" type="range" min="0" max="80" step="5" value="0" />
          <output id="minFitOut" for="minFit">0</output>
        </div>

        <label class="check"><input type="checkbox" id="dgOnly" checked /> Decision-grade primaries only</label>
        <label class="check"><input type="checkbox" id="ossOnly" /> Open source</label>
        <label class="check"><input type="checkbox" id="ycOnly" /> Has YC batch</label>
      </div>

      <p class="rail-hint">Click a row for full SID research. <kbd>/</kbd> focus search · <kbd>Esc</kbd> close.</p>
    </aside>

    <main id="main">
      <div class="results-head">
        <h2 id="resultsTitle">Ideas</h2>
        <p id="resultsCount" class="count"></p>
      </div>
      <div id="list" class="list" role="list"></div>
      <p id="empty" class="empty hidden">No matches. Loosen filters or clear search.</p>
    </main>
  </div>

  <div id="drawer" class="drawer" hidden aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <article class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
      <header class="drawer-top">
        <div>
          <p class="eyebrow" id="dEyebrow"></p>
          <h2 id="dTitle"></h2>
          <p class="d-sub" id="dSub"></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>
      <div class="drawer-body" id="dBody"></div>
    </article>
  </div>

  <script src="app.js"></script>
</body>
</html>
