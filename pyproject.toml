[project]
name = "idea-factory"
version = "0.2.0"
description = "Typed DAG scaffolding for the idea-factory skill. Code enforces contracts; agents do the reasoning."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idea_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]